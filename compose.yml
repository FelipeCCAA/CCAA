name: ccaa

x-backend-environment: &backend-environment
  DJANGO_ENV: ${DJANGO_ENV:-development}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-desarrollo-no-usar-en-produccion-cambiar-esta-clave-1234567890}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
  DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
  DB_ENGINE: postgresql
  DB_NAME: ${POSTGRES_DB:-ccaa}
  DB_USER: ${POSTGRES_USER:-ccaa}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
  DB_HOST: db
  DB_PORT: 5432
  DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
  DJANGO_HEALTHCHECK_HOST: ${DJANGO_HEALTHCHECK_HOST:-localhost}
  CCAA_INITIAL_COMPANY_RUT: ${CCAA_INITIAL_COMPANY_RUT:?Defina CCAA_INITIAL_COMPANY_RUT}
  CCAA_INITIAL_COMPANY_NAME: ${CCAA_INITIAL_COMPANY_NAME:?Defina CCAA_INITIAL_COMPANY_NAME}
  CCAA_INITIAL_BRANCH_CODE: ${CCAA_INITIAL_BRANCH_CODE:?Defina CCAA_INITIAL_BRANCH_CODE}
  CCAA_INITIAL_BRANCH_NAME: ${CCAA_INITIAL_BRANCH_NAME:?Defina CCAA_INITIAL_BRANCH_NAME}
  # Defensas del acceso. Van enumeradas aquí porque compose no pasa el entorno
  # entero: una variable que solo esté en .env no llega al contenedor, y en una
  # opción de seguridad eso es el peor fallo posible —parece configurada y no
  # lo está—.
  #
  # `PROXIES_DE_CONFIANZA` es obligatoria y no tiene valor por omisión a
  # propósito: con Nginx delante y sin ella, el límite por IP se esquiva
  # mandando una cabecera X-Forwarded-For distinta en cada petición. Que el
  # despliegue no arranque es preferible a que arranque desprotegido.
  PROXIES_DE_CONFIANZA: ${PROXIES_DE_CONFIANZA:?Defina PROXIES_DE_CONFIANZA (1 detras de Nginx)}
  THROTTLE_LOGIN_IP: ${THROTTLE_LOGIN_IP:-60/hour}
  THROTTLE_LOGIN_USUARIO: ${THROTTLE_LOGIN_USUARIO:-15/hour}
  TOKEN_TTL_HORAS: ${TOKEN_TTL_HORAS:-12}
  RESUMEN_DIAS: ${RESUMEN_DIAS:-90}
  # Vacías por defecto: sin ellas la caché usa PostgreSQL y el MRP corre dentro
  # de la petición, que es el comportamiento actual. Se rellenan cuando llegue
  # la fase de Redis.
  CACHE_URL: ${CACHE_URL:-}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
  CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT:-1200}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ccaa}
      POSTGRES_USER: ${POSTGRES_USER:-ccaa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [private]
    logging: &rotated-logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  migrate:
    build:
      context: ./backend
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
    restart: "no"

  backend:
    build:
      context: ./backend
    environment:
      <<: *backend-environment
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-30}
      GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-1000}
      GUNICORN_MAX_REQUESTS_JITTER: ${GUNICORN_MAX_REQUESTS_JITTER:-100}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/salud/listo/', headers={'Host': os.environ['DJANGO_HEALTHCHECK_HOST'], 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(r, timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks: [private, egress]
    logging: *rotated-logs

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
      args:
        VITE_API_URL: /api/
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DJANGO_HEALTHCHECK_HOST: ${DJANGO_HEALTHCHECK_HOST:-localhost}
    ports:
      - "${CCAA_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/api/salud/listo/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    networks: [private, edge]
    logging: *rotated-logs

networks:
  private:
    internal: true
  egress:
  edge:

volumes:
  postgres_data:
