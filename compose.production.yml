services:
  backend:
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defina DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Defina DJANGO_ALLOWED_HOSTS}
      DJANGO_HEALTHCHECK_HOST: ${DJANGO_HEALTHCHECK_HOST:?Defina DJANGO_HEALTHCHECK_HOST}
      DJANGO_SECURE_SSL_REDIRECT: "true"
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-31536000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Defina CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Defina CSRF_TRUSTED_ORIGINS}

  migrate:
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defina DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Defina DJANGO_ALLOWED_HOSTS}
      DJANGO_SECURE_SSL_REDIRECT: "true"
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-31536000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Defina CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Defina CSRF_TRUSTED_ORIGINS}

  nginx:
    environment:
      DJANGO_HEALTHCHECK_HOST: ${DJANGO_HEALTHCHECK_HOST:?Defina DJANGO_HEALTHCHECK_HOST}
    volumes:
      - ./infra/nginx/nginx.production.conf:/etc/nginx/nginx.conf:ro
      - ${CCAA_TLS_DIR:?Defina CCAA_TLS_DIR}:/etc/nginx/tls:ro
    ports: !override
      - "${CCAA_HTTP_PORT:-80}:8080"
      - "${CCAA_HTTPS_PORT:-443}:8443"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --header=\"Host: $${DJANGO_HEALTHCHECK_HOST}\" --quiet --tries=1 --spider https://127.0.0.1:8443/api/salud/listo/"]
