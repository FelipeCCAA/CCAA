name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ccaa_ci
          POSTGRES_USER: ccaa
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccaa -d ccaa_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DJANGO_ENV: ci
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret-012345678901234567890123456789
      DJANGO_ALLOWED_HOSTS: localhost
      DB_ENGINE: postgresql
      DATABASE_URL: postgresql://ccaa:ci-only-password@127.0.0.1:5432/ccaa_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install --requirement requirements-dev.txt
      - run: ruff check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test --verbosity 1

  production-config:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_ENV: production
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ci-validation-not-a-production-secret-012345678901234567890123
      DJANGO_ALLOWED_HOSTS: ccaa.example.invalid
      DJANGO_SECURE_SSL_REDIRECT: "true"
      DJANGO_SECURE_HSTS_SECONDS: "31536000"
      CSRF_TRUSTED_ORIGINS: https://ccaa.example.invalid
      DB_ENGINE: postgresql
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install --requirement requirements.txt
      - run: python manage.py check --deploy

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit --pretty false
      - run: npm run build
