user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;
    keepalive_timeout 30;
    client_max_body_size 15m;

    log_format structured escape=json
        '{"time":"$time_iso8601","remote":"$remote_addr",'
        '"request_id":"$request_id","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';
    access_log /var/log/nginx/access.log structured;

    upstream ccaa_backend {
        server backend:8000;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location /static/ {
            alias /srv/django-static/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # Vite agrega hash al nombre de estos archivos: se pueden conservar en
        # el navegador durante un año sin servir contenido viejo.
        location /assets/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ~ ^/(api|admin)(/|$) {
            proxy_pass http://ccaa_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # No se acepta una cadena enviada por el cliente: Nginx, única
            # entrada pública, fija el origen observado.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
